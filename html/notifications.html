<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notifications | MediMap</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a href="index.html"
class="navbar-brand fw-bold">

<i class="fa-solid fa-kit-medical"></i>

MediMap

</a>

<div class="ms-auto">

<a href="dashboard.html"
class="btn btn-light">

Dashboard

</a>

</div>

</div>

</nav>

<!-- HEADER -->

<section class="bg-primary text-white py-5">

<div class="container">

<h2>

🔔 Notifications

</h2>

<p>

Medicine alerts and pharmacy updates

</p>

</div>

</section>

<!-- NOTIFICATION LIST -->

<section class="container py-5">

<div id="notificationContainer">

<div class="notification">

<div>

<i class="fa-solid fa-bell fa-2x text-primary"></i>

</div>

<div class="flex-grow-1">

<h5>

Medicine Available

</h5>

<p>

Paracetamol is available at Apollo Pharmacy.

</p>

<small class="text-muted">

2 minutes ago

</small>

</div>

<button class="btn btn-success">

View

</button>

</div>

<div class="notification">

<div>

<i class="fa-solid fa-triangle-exclamation fa-2x text-danger"></i>

</div>

<div class="flex-grow-1">

<h5>

Low Stock Alert

</h5>

<p>

Crocin stock is below minimum level.

</p>

<small class="text-muted">

10 minutes ago

</small>

</div>

<button class="btn btn-danger">

Details

</button>

</div>

<div class="notification">

<div>

<i class="fa-solid fa-calendar-check fa-2x text-warning"></i>

</div>

<div class="flex-grow-1">

<h5>

Medicine Expiry

</h5>

<p>

Vitamin C expires in 5 days.

</p>

<small class="text-muted">

Today

</small>

</div>

<button class="btn btn-warning">

Review

</button>

</div>

</div>

</section>

<footer class="bg-dark text-white py-4">

<div class="container text-center">

© 2026 MediMap

</div>

</footer>

<script src="../javascript/app.js"></script>

</body>

</html>
